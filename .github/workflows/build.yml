name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Package the integration
        run: cd custom_components/git_sync && zip -r ../../git_sync.zip . -x "__pycache__/*"
      - uses: actions/upload-artifact@v4
        with:
          name: git_sync
          path: git_sync.zip
          retention-days: 14
