[project]
name = "ha-git-sync"
version = "0.1.0"
description = "Home Assistant integration: Git commit/push of the configuration and dashboard export"
requires-python = ">=3.13"
license = "MIT"

[tool.ruff]
target-version = "py313"
line-length = 110
src = ["custom_components", "tests"]
extend-exclude = ["vulture_whitelist.py"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PL", "PTH", "ASYNC", "BLE", "TRY", "D", "N",
]
ignore = [
  "D203", "D213", "D105", "D107",
  "PLR0913", "PLR2004",
  "TRY003", "TRY400",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004", "S101"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.vulture]
paths = ["custom_components", "vulture_whitelist.py"]
min_confidence = 60

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
